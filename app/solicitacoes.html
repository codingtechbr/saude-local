<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Solicite e acompanhe exames, consultas e cirurgias pelo celular.">
    <meta name="theme-color" content="#176b5b">
    <title>Pedidos · Saúde Municipal</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" href="../assets/logo/logo.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../assets/icons/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-title" content="Saúde">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">

    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="app-shell">
    <header class="app-header">
        <h1 class="app-header__title" id="page-title">Meus pedidos</h1>
        <a class="icon-btn" href="nova-solicitacao.html" aria-label="Nova solicitação"><span data-icon="plus"></span></a>

    <main class="page-content">
        <div class="tabs" role="tablist" aria-label="Filtrar solicitações">
            <button type="button" class="tab" role="tab" data-tab="active" aria-selected="true">Em andamento</button>
            <button type="button" class="tab" role="tab" data-tab="done" aria-selected="false">Finalizadas</button>

        <div id="requests-list" aria-live="polite"></div>
    </main>
